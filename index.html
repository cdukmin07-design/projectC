<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공룡 월드</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🦖 공룡 월드</h1>
  <p>공룡을 좋아하는 사람들을 위한 홈페이지</p>
</header>

<nav>
  <a href="#">홈</a>
  <a href="#">갤러리</a>
  <a href="#">게시판</a>
  <a href="#">공룡도감</a>
</nav>

<section class="hero">
  <h2>공룡의 시대에 오신 것을 환영합니다!</h2>
</section>

<main class="container">

  <section class="write-box">
    <h2>✍ 게시글 작성</h2>

    <form id="postForm">
      <input type="text" id="title" placeholder="제목 입력" required>

      <textarea id="content" placeholder="내용 입력" required></textarea>

      <input type="file" id="imageUpload" accept="image/*">

      <img id="preview" class="preview">

      <button type="submit">게시글 등록</button>
    </form>
  </section>

  <section>
    <h2>📌 게시글 목록</h2>

    <div id="postList">
      <div class="post">
        <h3>티라노사우루스</h3>
        <p>가장 유명한 육식 공룡 중 하나입니다.</p>
      </div>
    </div>
  </section>

</main>

<footer>
  © 2026 Dinosaur World
</footer>

<script src="script.js"></script>

</body>
</html>
